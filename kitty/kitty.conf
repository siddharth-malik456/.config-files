font_family      JetBrainsMono Nerd Font
font_size        14

bold_font        auto
italic_font      auto
bold_italic_font auto

background_opacity 0.85
blur_background yes

window_padding_width 15
window_margin_width 0
margin_width 0
dynamic_background_opacity yes

cursor_shape beam
cursor_blink_interval 0
hide_window_decorations yes

scrollback_lines 2000

# Colors
background #0a0c10
foreground #c5c8c6

color0  #1e1e1e
color8  #2d2d2d

color1  #ff5c57
color9  #ff6e67

color2  #5af78e
color10 #5ef1a9

color3  #f3f99d
color11 #f1fa8c

color4  #57c7ff
color12 #62d6ff

color5  #ff6ac1
color13 #ff92df

color6  #9aedfe
color14 #a4ffff

color7  #f1f1f0
color15 #ffffff

# Slightly dim inactive text
inactive_text_alpha 0.7

tab_bar_style powerline
window_border_width 0.5pt
draw_minimal_borders yes

active_border_color #5af78e

initial_window_width  640
initial_window_height 400

hide_window_decorations no
macos_titlebar_color background
macos_thicken_font 0.75

enabled_layouts splits
enable_audio_bell no

# Keybindings
map alt+t                new_tab_with_cwd !neighbor
map alt+s                next_tab
map alt+a                previous_tab
map alt+w                close_tab
map ctrl+alt+s           set_tab_title
map alt+shift+left       move_tab_backward
map alt+shift+right      move_tab_forward

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

